<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin - Mumbai Summit</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #181b24;
        --line: #2a2f3c;
        --tx: #e8eaf0;
        --mu: #8b93a7;
        --ac: #f5b335;
        --ok: #3ecf8e;
        --bad: #ef6a6a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 15px;
        margin: 24px 0 8px;
        color: var(--mu);
        font-weight: 600;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      input,
      select {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
      }
      button {
        cursor: pointer;
      }
      button.p {
        background: var(--ac);
        color: #111;
        border-color: var(--ac);
        font-weight: 600;
      }
      .login {
        max-width: 340px;
        margin: 12vh auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        gap: 12px;
      }
      .login input {
        width: 100%;
      }
      .pwrap {
        position: relative;
      }
      .pwrap input {
        padding-right: 44px;
      }
      .pwrap .eye {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: 0;
        border-radius: 6px;
        padding: 4px;
        width: auto;
        cursor: pointer;
        color: #374151;
        display: flex;
        opacity: 1;
      }
      .pwrap .eye:hover {
        background: rgba(0, 0, 0, 0.1);
      }
      .pwrap .eye svg {
        stroke: currentColor;
        display: block;
      }
      .pwrap .eye svg[hidden] {
        display: none;
      }
      .err {
        color: var(--bad);
        min-height: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .c {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .c b {
        display: block;
        font-size: 24px;
      }
      .c span {
        color: var(--mu);
      }
      .tw {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 720px;
      }
      th,
      td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--mu);
        font-weight: 600;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 12px;
      }
      .paid {
        background: #143d2c;
        color: var(--ok);
      }
      .pending {
        background: #3a2f12;
        color: var(--ac);
      }
      .failed {
        background: #40191c;
        color: var(--bad);
      }
      .f {
        display: flex;
        gap: 8px;
        margin: 8px 0;
        flex-wrap: wrap;
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
        margin-right: 8px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <form class="login" id="lf">
      <!-- <p>This Website is Build by Aman Saeoha</p> -->
      <h1>Admin login</h1>
      <input
        id="em"
        type="email"
        placeholder="Email"
        autocomplete="username"
        required
      />
      <div class="pwrap">
        <input
          id="pw"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="button" id="pwt" class="eye" aria-label="Show password" title="Show password">
          <svg id="eyeon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeoff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="err" id="le"></div>
      <button class="p">Sign in</button>
    </form>
    <div class="wrap" id="app" hidden>
      <div class="bar">
        <h1>Mumbai Summit 2027 - Leads</h1>
        <div>
          <span id="fst" class="mu"></span>
          <button id="rf">Fetch data</button> <button id="csv">Export CSV</button>
          <button id="lo">Log out</button>
        </div>
      </div>
      <h2>Overview</h2>
      <div class="cards" id="tot"></div>
      <h2>Tickets: clicks to payments (unique visitors)</h2>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Pass</th>
              <th>Clicked</th>
              <th>Selected</th>
              <th>Registered</th>
              <th>Paid</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody id="bp"></tbody>
        </table>
      </div>
      <h2>Registrations</h2>
      <div class="f">
        <input id="q" placeholder="Search name / email / phone" /><select
          id="fp"
        >
          <option value="">All passes</option>
        </select>
        <select id="fs">
          <option value="">All payments</option>
          <option>Paid</option>
          <option>Awaiting payment</option>
          <option>Not paid</option>
          <option>Failed</option>
        </select>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Pass</th>
              <th>State</th>
              <th>Committed</th>
              <th>Payment</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="rg"></tbody>
        </table>
      </div>
      <h2>Latest activity</h2>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Event</th>
              <th>Pass</th>
              <th>Who</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="ev"></tbody>
        </table>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      $("pwt").addEventListener("click", () => {
        const show = $("pw").type === "password";
        $("pw").type = show ? "text" : "password";
        $("eyeon").hidden = show;
        $("eyeoff").hidden = !show;
        $("pwt").setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const dt = (s) =>
        s
          ? new Date(s).toLocaleString("en-IN", {
              dateStyle: "medium",
              timeStyle: "short",
            })
          : "";
      const src = (r) => (r.utm && r.utm.utm_source) || "direct";
      let D = null;
      async function load() {
        const btn = $("rf"),
          st8 = $("fst");
        btn.disabled = true;
        btn.textContent = "Fetching…";
        try {
          await loadData();
        } catch (e) {
          st8.textContent = "Fetch failed. Check your connection and try again.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Fetch data";
        }
      }
      async function loadData() {
        const r = await fetch("/api/admin-data");
        if (r.status === 401) {
          $("app").hidden = true;
          $("lf").hidden = false;
          return;
        }
        if (!r.ok) {
          $("le").textContent = "Could not load data.";
          $("fst").textContent = "Could not load data from the database.";
          return;
        }
        D = await r.json();
        $("fst").textContent =
          "Fetched " +
          D.totals.registered +
          " registrations at " +
          new Date().toLocaleTimeString("en-IN", { timeStyle: "short" });
        $("lf").hidden = true;
        $("app").hidden = false;
        $("tot").innerHTML = [
          ["Registered", D.totals.registered],
          ["Paid", D.totals.paid],
          ["Unpaid", D.totals.registered - D.totals.paid],
          ["Revenue", "Rs " + D.totals.revenue.toLocaleString("en-IN")],
        ]
          .map((x) => `<div class="c"><b>${x[1]}</b><span>${x[0]}</span></div>`)
          .join("");
        $("bp").innerHTML = D.byPass
          .map(
            (p) =>
              `<tr><td>${esc(p.pass)}</td><td>${p.clicks}</td><td>${p.selected}</td><td>${p.registered}</td><td>${p.paid}</td><td>Rs ${p.revenue.toLocaleString("en-IN")}</td></tr>`,
          )
          .join("");
        if ($("fp").options.length < 2)
          D.byPass.forEach((p) => $("fp").add(new Option(p.pass, p.pass)));
        $("ev").innerHTML = D.recent
          .map(
            (e) =>
              `<tr><td>${dt(e.at)}</td><td>${esc(e.event)}</td><td>${esc(e.pass)}</td><td>${esc(e.name || "Anonymous visitor")}</td><td>${esc(e.email)}</td></tr>`,
          )
          .join("");
        draw();
      }
      // Paid -> "Paid". Unpaid -> "Awaiting payment" for 5 min after submit, then "Not paid".
      const WAIT_MS = 5 * 60 * 1000;
      function st(r) {
        if (r.paid || r.paymentStatus === "paid") return "Paid";
        if (r.paymentStatus === "failed") return "Failed";
        const t = new Date(r.lastSubmittedAt || r.createdAt).getTime();
        return Date.now() - t < WAIT_MS ? "Awaiting payment" : "Not paid";
      }
      const cls = (s) => ({ Paid: "paid", Failed: "failed", "Awaiting payment": "pending", "Not paid": "failed" })[s];
      setInterval(() => { if (D) load(); }, 30000);
      function rows() {
        const q = $("q").value.toLowerCase(),
          p = $("fp").value,
          s = $("fs").value;
        return D.regs.filter(
          (r) =>
            (!p || r.pass === p) &&
            (!s || st(r) === s) &&
            (!q ||
              [r.name, r.email, r.phone].join(" ").toLowerCase().includes(q)),
        );
      }
      function draw() {
        $("rg").innerHTML =
          rows()
            .map(
              (r) =>
                `<tr><td>${dt(r.createdAt)}</td><td>${esc(r.name)}${r.partner ? `<br><small>+ ${esc(r.partner.name)}</small>` : ""}</td><td>${esc(r.email)}${r.partner && r.partner.email ? `<br><small>${esc(r.partner.email)}</small>` : ""}</td><td>${esc(r.phone)}${r.partner ? `<br><small>${esc(r.partner.phone)}</small>` : ""}</td><td>${esc(r.pass)}</td><td>${esc(r.state)}</td><td>${esc(r.committed)}</td><td><span class="tag ${cls(st(r))}">${st(r)}</span></td><td>${esc(src(r))}</td></tr>`,
            )
            .join("") || '<tr><td colspan="9">No results</td></tr>';
      }
      ["q", "fp", "fs"].forEach((i) =>
        $(i).addEventListener("input", () => {
          if (D) draw();
        }),
      );
      $("lf").onsubmit = async (e) => {
        e.preventDefault();
        $("le").textContent = "";
        const r = await fetch("/api/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: $("em").value,
            password: $("pw").value,
          }),
        });
        if (r.ok) {
          $("pw").value = "";
          load();
        } else $("le").textContent = "Invalid email or password.";
      };
      $("rf").onclick = load;
      $("lo").onclick = async () => {
        await fetch("/api/admin-login", { method: "DELETE" });
        D = null;
        $("app").hidden = true;
        $("lf").hidden = false;
      };
      $("csv").onclick = () => {
        const h = [
          "createdAt",
          "name",
          "email",
          "phone",
          "pass",
          "state",
          "committed",
          "paymentStatus",
          "amountPaid",
          "paidAt",
          "source",
        ];
        const c = (v) => {
          v = String(v == null ? "" : v);
          if (/^[=+\-@]/.test(v)) v = "'" + v;
          return '"' + v.replace(/"/g, '""') + '"';
        };
        const t = [h.join(",")]
          .concat(
            rows().map((r) =>
              h.map((k) => c(k === "source" ? src(r) : k === "paymentStatus" ? st(r) : r[k])).join(","),
            ),
          )
          .join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" }));
        a.download = "registrations.csv";
        a.click();
      };
      load();
    </script>
  </body>
</html>
